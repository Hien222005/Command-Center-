<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Command Center</title>
<style>
:root{
  --bg:#f5f5f7;--s1:#ffffff;--s2:#f2f2f7;--s3:#e5e5ea;
  --br:rgba(0,0,0,.04);--tx:#1d1d1f;--dm:#86868b;--mt:#aeaeb2;
  --cy:#0071e3;--gn:#34c759;--or:#ff9500;--rd:#ff3b30;--lime:#C8FF00;--limedark:#9FCC00;--limebg:rgba(200,255,0,.08);
  --pu:#af52de;--yl:#ffcc00;--pk:#ff2d55
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
  background:var(--bg);color:var(--tx);min-height:100dvh;
  padding:0 0 20px 0;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale
}
.mono{font-family:'SF Mono',SFMono-Regular,Menlo,monospace;font-size:.9em}
body::before{display:none}.amb{display:none}
#confetti{position:fixed;inset:0;z-index:200;pointer-events:none}
.gflash{position:fixed;inset:0;z-index:150;pointer-events:none;opacity:0}
.gflash.fire{animation:gf .35s ease-out}
@keyframes gf{0%{opacity:0;background:radial-gradient(circle,rgba(200,255,0,.08),transparent 60%)}30%{opacity:1}100%{opacity:0}}

/* ===== TOAST ===== */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-120px);z-index:180;
  background:var(--s1);border-radius:20px;padding:14px 22px;display:flex;align-items:center;gap:12px;
  box-shadow:0 10px 40px rgba(0,0,0,.12);transition:transform .45s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .ti{font-size:24px}.toast .tt{font-size:15px;font-weight:600}.toast .ts{font-size:12px;color:var(--dm);margin-top:1px}

/* ===== SPORT CARD ===== */
.sc{margin:calc(env(safe-area-inset-top,20px) + 8px) 24px 0;border-radius:20px;position:relative;z-index:2;overflow:hidden;cursor:pointer;height:100px}
.sc-bg{position:absolute;inset:0;transition:opacity .6s}
.sc-ars,.sc-gsw,.sc-pick{background:#1d1d1f}
.sc-pat{display:none}
.sc-deco{position:absolute;z-index:1;opacity:.03;width:80px;height:80px;right:20px;top:10px}
.sc-cnt{position:relative;z-index:2;padding:20px 24px;height:100%;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.sc-badge{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;background:rgba(255,255,255,.1);padding:3px 10px;border-radius:20px;display:inline-block}
.sc-q{font-size:14px;font-weight:500;line-height:1.4;letter-spacing:-.01em;max-width:85%;opacity:.85}
.sc-s{font-size:11px;opacity:.35;margin-top:2px;font-weight:400}
.sc-dots{display:flex;gap:5px;justify-content:center;margin-top:8px;position:relative;z-index:2}
.sc-dot{width:6px;height:6px;border-radius:50%;background:var(--mt);cursor:pointer;transition:all .3s}
.sc-dot.a{background:var(--tx);width:20px;border-radius:3px}

/* ===== SCOREBOARD ===== */
.sboard{margin:12px 24px 0;position:relative;z-index:2;display:flex;gap:10px}
.sb-m{flex:1;background:var(--s1);border-radius:20px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.sb-l .sb-lb{font-size:11px;color:var(--dm);font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.sb-l .sb-dy{font-size:26px;font-weight:600;margin-top:2px;letter-spacing:-.03em}
.sb-sc{font-size:32px;font-weight:700;line-height:1;color:var(--cy);transition:all .3s}
.sb-sc.pulse{animation:sp .35s ease}
@keyframes sp{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.sb-mx{font-size:12px;color:var(--dm)}
.sb-sk{background:var(--s1);border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px;cursor:pointer;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.sb-sk .sf{font-size:18px;margin-bottom:2px}
.sb-sk .sn{font-size:24px;font-weight:700;color:var(--or)}
.sb-sk .sl{font-size:9px;color:var(--dm);font-weight:500;letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.sb-sk .sb2{font-size:9px;color:var(--mt);margin-top:1px}

/* ===== SCORE BAR ===== */
.st{margin:10px 24px 0;position:relative;z-index:2}
.st-bg{height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.st-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.st-fill.low{background:var(--rd)}.st-fill.mid{background:var(--or)}.st-fill.high{background:var(--gn)}
.st-msg{font-size:13px;color:var(--dm);margin-top:6px;text-align:center;font-weight:500}
.nmt{background:rgba(255,149,0,.06);border-radius:16px;padding:12px 18px;margin:8px 24px 0;position:relative;z-index:2;display:none;font-size:13px;color:var(--or);font-weight:500}
.nmt.show{display:flex;align-items:center;gap:8px}

/* ===== PROJECT BANNER ===== */
.proj-ban{padding:8px 24px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;white-space:nowrap;position:relative;z-index:2;scrollbar-width:none}
.proj-ban::-webkit-scrollbar{display:none}
.proj-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;cursor:pointer;flex-shrink:0;margin-right:6px;font-size:13px;font-weight:500;background:var(--s1);box-shadow:0 2px 10px rgba(0,0,0,.06)}

/* ===== TABS — macOS Dock Glass ===== */
.tw{position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:50;transition:all .3s}
.tw.pos-right{left:auto;right:12px}
.tw.pos-top{left:50%;top:12px;transform:translateX(-50%)}
.tw.pos-bottom{left:50%;top:auto;bottom:12px;transform:translateX(-50%)}
.tabs{display:flex;flex-direction:column;gap:6px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-radius:22px;padding:10px;overflow:visible;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(0,0,0,.04)}
.tw.pos-top .tabs,.tw.pos-bottom .tabs{flex-direction:row}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px;border-radius:14px;border:none;font-size:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-family:inherit;background:transparent;color:#1d1d1f;transition:all .2s;white-space:nowrap;position:relative}
.tab .tab-icon{font-size:20px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.1))}
.tab .tab-label{display:none;font-size:11px;font-weight:600;margin-left:8px}
.tab:hover{background:rgba(255,255,255,.7);transform:scale(1.08)}
.tab.a{background:linear-gradient(180deg,#D8FF1F 0%,#C8FF00 100%);color:#1d1d1f;
  box-shadow:0 4px 12px rgba(200,255,0,.4),inset 0 1px 0 rgba(255,255,255,.8)}
.tab:hover .tab-tip{display:block}
.tab-tip{display:none;position:absolute;left:56px;background:rgba(30,30,30,.92);backdrop-filter:blur(10px);color:#fff;padding:6px 11px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tw.pos-right .tab-tip{left:auto;right:56px}
.tw.pos-top .tab-tip,.tw.pos-bottom .tab-tip{left:50%;transform:translateX(-50%);top:auto;bottom:-32px}
body.nav-left{padding-left:80px}
body.nav-right{padding-right:80px}
@media(max-width:767px){
  .tw{position:fixed;left:0;right:0;top:auto;bottom:0;transform:none;padding:0 8px 8px}
  .tw.pos-right,.tw.pos-top,.tw.pos-bottom{left:0;right:0;top:auto;bottom:0;transform:none}
  .tabs{flex-direction:row;justify-content:center;border-radius:20px;padding:8px}
  .tab{width:42px;height:42px;padding:9px}
  .tab-tip{display:none!important}
  body.nav-left,body.nav-right{padding-left:0;padding-right:0;padding-bottom:74px}
}

/* ===== PAGES ===== */
.pg{display:none;padding:16px 24px 0;position:relative;z-index:2}.pg.a{display:block;animation:pi .3s ease}
@keyframes pi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== CARDS ===== */
.cd{background:var(--s1);border-radius:20px;padding:20px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.cd-sp{}.cd-sp::before{display:none}
.cd-sp.cd-body::before,.cd-sp.cd-biz::before,.cd-sp.cd-brain::before,.cd-sp.cd-bank::before{display:none}
.cd-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cd-t{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:-.01em}
.cd-p{font-size:13px;font-weight:600;padding:4px 10px;border-radius:20px}

/* ===== ITEMS — iOS List ===== */
.pi{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;margin-bottom:5px;
  cursor:pointer;transition:all .2s;background:var(--s1);border:none;position:relative;overflow:hidden;
  -webkit-user-select:none;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.pi:active{transform:scale(.98);background:var(--s2)}
.pi.done{background:rgba(52,199,89,.04)}
.pi.done::before{display:none}
.pi.done .pc{background:#C8FF00;border-color:#C8FF00;box-shadow:none}
.pi.done .pc::after{content:'✓';color:#fff;font-size:11px;font-weight:700}
.pc{width:22px;height:22px;border-radius:7px;border:2px solid var(--mt);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .25s;pointer-events:none}
.pl{flex:1;font-size:15px;font-weight:400;pointer-events:none;letter-spacing:-.01em}
.pp{font-size:13px;font-weight:600;color:var(--dm);flex-shrink:0;pointer-events:none}
.pi.done .pp{color:var(--gn)}
.pe{width:22px;height:22px;border-radius:6px;border:none;background:none;color:var(--mt);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;z-index:5}

/* ===== SCORE POP ===== */
.spop{position:fixed;font-weight:700;pointer-events:none;z-index:999;font-size:20px}
.spop.plus{color:var(--gn);animation:pu .8s ease-out forwards}
.spop.minus{color:var(--rd);animation:pd .5s ease-out forwards}
@keyframes pu{0%{opacity:1;transform:translateY(0) scale(.8)}30%{transform:translateY(-20px) scale(1.15)}100%{opacity:0;transform:translateY(-50px) scale(1)}}
@keyframes pd{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(8px)}}

/* ===== INPUTS & BUTTONS ===== */
.ar{display:flex;gap:6px;margin-top:6px}
.ai{flex:1;background:var(--s2);border:1.5px solid transparent;border-radius:14px;padding:14px 16px;color:var(--tx);font-size:17px;font-family:inherit;outline:none;transition:border-color .2s}
.ai:focus{border-color:var(--cy)}.ai::placeholder{color:var(--mt);font-size:15px}
.apt{width:44px;background:var(--s2);border:1.5px solid transparent;border-radius:14px;padding:10px;color:var(--cy);font-size:15px;font-family:'SF Mono',monospace;text-align:center;outline:none}
.btn{padding:10px 18px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;letter-spacing:-.01em}
.btn:active{transform:scale(.96)}
.btn-cy{background:var(--cy);color:#fff}
.btn-gn{background:var(--gn);color:#fff}
.btn-rd{background:rgba(255,59,48,.1);color:var(--rd)}
.btn-pu{background:rgba(175,82,222,.1);color:var(--pu)}
.btn-full{width:100%;padding:14px;font-size:17px;border-radius:14px}

/* ===== WEEKLY ===== */
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.wd{text-align:center;padding:10px 0;border-radius:12px;font-size:13px;font-weight:500;background:var(--s1);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.wd .wdl{font-size:10px;color:var(--dm);margin-bottom:3px;font-weight:500}
.wd .wds{font-size:18px;font-weight:700;letter-spacing:-.02em}
.wd.green{background:rgba(52,199,89,.08);color:var(--gn)}
.wd.yellow{background:rgba(255,204,0,.08);color:var(--or)}
.wd.red{background:rgba(255,59,48,.06);color:var(--rd)}
.wd.empty{opacity:.12}.wd.tring{box-shadow:inset 0 0 0 2px var(--cy)}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wst{background:var(--s1);border-radius:16px;padding:14px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.wst .wv{font-size:28px;font-weight:700;letter-spacing:-.03em}
.wst .wl{font-size:10px;color:var(--dm);margin-top:3px;font-weight:500;text-transform:uppercase;letter-spacing:.8px}
.pbr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pbl{font-size:13px;font-weight:500;width:55px;flex-shrink:0}
.pbbg{flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.pbf{height:100%;border-radius:3px;transition:width .5s}
.pbp{font-size:13px;font-weight:600;width:34px;text-align:right;flex-shrink:0}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.hmc{aspect-ratio:1;border-radius:4px}

/* ===== CALENDAR ===== */
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cnb{background:var(--s2);border:none;border-radius:10px;padding:8px 14px;color:var(--tx);font-size:15px;cursor:pointer;font-family:inherit;font-weight:500}
.cnb:active{background:var(--s3)}
.cm{font-size:22px;font-weight:600;letter-spacing:-.02em}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ch{text-align:center;font-size:11px;font-weight:500;color:var(--dm);padding:5px 0}
.cc{min-height:62px;background:var(--s1);border-radius:10px;padding:3px 4px;cursor:pointer;overflow:hidden;border:none;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.cc:active{background:var(--s3)}
.cc.today{box-shadow:inset 0 0 0 2px var(--cy);background:rgba(0,113,227,.02)}
.cc.other{opacity:.06;pointer-events:none;box-shadow:none}
.cc .gym-ring{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:12px;font-weight:600}
.cc .br-tag{font-size:8px;padding:1px 3px;border-radius:3px;margin-bottom:1px;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cc .ev-tag{font-size:7px;padding:1px 3px;border-radius:3px;margin-bottom:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cc .proj-bar{height:2px;border-radius:1px;margin-top:1px}

/* ===== MEAL ===== */
.ms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.mb{background:var(--s1);border-radius:16px;padding:12px 4px;text-align:center;box-shadow:0 1px 8px rgba(0,0,0,.05)}
.mb .mv{font-size:24px;font-weight:700;letter-spacing:-.03em}
.mb .ml{font-size:10px;color:var(--dm);font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.mb .md{font-size:11px;font-weight:600;margin-top:3px}
.me{background:var(--s2);border-radius:12px;padding:12px 14px;margin-bottom:4px;display:flex;align-items:center}
.me .mn{font-size:15px;font-weight:400;flex:1}.me .mm{font-size:13px;color:var(--dm);font-family:'SF Mono',monospace}
.mi input{flex:1;background:var(--s2);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;color:var(--tx);font-size:17px;font-family:inherit;outline:none}
.mi input:focus{border-color:var(--cy)}.mi input::placeholder{color:var(--mt);font-size:15px}
.mp-toggle{padding:14px 18px;background:var(--s1);border-radius:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.mp-toggle.open{border-radius:14px 14px 0 0;margin-bottom:0}
.mp-body{background:var(--s1);border-radius:0 0 14px 14px;padding:12px 18px;display:none;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}.mp-body.open{display:block}
.water-bar{display:flex;gap:6px;margin-top:8px}
.water-drop{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:1.5px solid var(--s3);transition:all .15s}
.water-drop.filled{background:rgba(0,113,227,.06);border-color:rgba(0,113,227,.15)}

/* ===== WORKOUT ===== */
.wo-tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wo-tabs::-webkit-scrollbar{display:none}
.wt{padding:10px 18px;border-radius:12px;background:var(--s2);border:none;color:var(--dm);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .2s}
.wt.a{color:#fff;background:var(--tx)}
.wex{background:var(--s2);border-radius:14px;padding:14px 16px;margin-bottom:5px}
.wex .wen{font-size:15px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.wex .wed{font-size:13px;color:var(--dm);line-height:1.4}
.wex .wem{font-size:11px;color:var(--pu);font-weight:500;margin-top:4px}
.wsec-title{font-size:13px;font-weight:600;margin:14px 0 6px;padding-left:2px;color:var(--dm)}

/* ===== PROJECTS ===== */
.pj{background:var(--s1);border-radius:20px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.06)}

/* ===== CALENDAR VIEW TOGGLE ===== */
.cv-toggle{display:flex;gap:6px;background:var(--s2);padding:4px;border-radius:14px;margin-bottom:14px;width:fit-content}
.cv-toggle button{border:none;background:transparent;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;color:var(--dm);cursor:pointer;font-family:inherit;transition:all .2s}
.cv-toggle button.a{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* ===== ROADMAP ===== */
.rm-wrap{position:relative;border-radius:20px;overflow:hidden}
.rm-scroll{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;position:relative}
.rm-scroll::-webkit-scrollbar{height:8px}
.rm-scroll::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}
.rm-grid{display:grid;position:relative;min-width:max-content}
.rm-month-label{padding:10px 8px;font-size:11px;font-weight:700;color:var(--dm);text-align:center;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--s3);background:var(--s2);position:sticky;top:0;z-index:3}
.rm-month-label.cur{background:rgba(200,255,0,.15);color:#1d1d1f}
.rm-fixed-col{position:sticky;left:0;z-index:4;background:var(--s1);border-right:1px solid var(--s3);padding:12px 14px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;min-height:48px}
.rm-fixed-col.head{background:var(--s2);font-size:11px;color:var(--dm);font-weight:700;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid var(--s3);z-index:5;top:0;position:sticky}
.rm-row{display:contents}
.rm-cell{height:48px;border-bottom:1px solid var(--s3);position:relative}
.rm-bar{position:absolute;height:24px;top:12px;border-radius:12px;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:600;color:#fff;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .15s}
.rm-bar:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.2)}
.rm-bar.striped{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0,rgba(255,255,255,.18) 6px,transparent 6px,transparent 12px)!important}
.rm-milestone{position:absolute;top:6px;font-size:14px;cursor:pointer;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.rm-today{position:absolute;top:0;bottom:0;width:2px;background:#C8FF00;box-shadow:0 0 6px rgba(200,255,0,.7);z-index:1;pointer-events:none}
.rm-today::before{content:'';position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:#C8FF00;box-shadow:0 0 8px rgba(200,255,0,.8)}
.rm-legend{display:flex;flex-wrap:wrap;gap:14px;padding:14px 18px;border-top:1px solid var(--s3);background:var(--s1);font-size:12px;color:var(--dm);align-items:center}
.rm-legend-item{display:flex;align-items:center;gap:6px}
.rm-legend-dot{width:14px;height:14px;border-radius:7px}
.rm-empty{padding:60px 24px;text-align:center;color:var(--mt);font-size:14px}

/* ===== PROJECT GRID 2×2 ===== */
.pj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
@media(max-width:900px){.pj-grid{grid-template-columns:1fr}}
.pj-card{padding:18px 20px;cursor:pointer;border-left:4px solid var(--cy);transition:all .2s;position:relative;display:flex;flex-direction:column;gap:10px;min-height:170px}
.pj-card.act{box-shadow:0 0 0 2px var(--cy),0 8px 28px rgba(0,113,227,.15)}
.pj-card.dim{opacity:.55}
.pj-card:hover:not(.act){transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
.pj-card-head{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pj-card-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.pj-card-title .ico{font-size:24px;flex-shrink:0}
.pj-card-title .nm{font-size:16px;font-weight:800;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pj-pill{font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;letter-spacing:.5px;text-transform:uppercase;flex-shrink:0}
.pj-pill.not_started{background:rgba(142,142,147,.15);color:#5a5a60}
.pj-pill.in_progress{background:rgba(0,113,227,.15);color:#0050a0}
.pj-pill.done{background:rgba(52,199,89,.15);color:#1a7f3c}
.pj-pill.urgent{background:rgba(255,59,48,.15);color:#b8281e}
/* Legacy (data not yet migrated at render time) */
.pj-pill.green{background:rgba(52,199,89,.15);color:#1a7f3c}
.pj-pill.yellow{background:rgba(255,204,0,.18);color:#996600}
.pj-pill.red{background:rgba(255,59,48,.15);color:#b8281e}
.pj-card.done-card{opacity:.55}
.pj-card.done-card .nm{text-decoration:line-through;color:var(--dm)}
.pj-urgent-flag{position:absolute;top:14px;right:14px;font-size:18px;cursor:pointer;line-height:1;transition:transform .2s}
.pj-urgent-flag:hover{transform:scale(1.2)}
.pj-urgent-flag.off{opacity:.3}
.pj-urgent-flag.on{filter:drop-shadow(0 0 4px rgba(255,59,48,.6))}
.pj-pin-flag{position:absolute;top:14px;right:42px;font-size:16px;cursor:pointer;line-height:1;transition:transform .2s}
.pj-pin-flag:hover{transform:scale(1.2)}
.pj-pin-flag.off{opacity:.3;filter:grayscale(.8)}
.pj-pin-flag.on{filter:drop-shadow(0 0 4px rgba(255,204,0,.7))}
.pj-cat-tag{font-size:11px;font-weight:600;color:var(--dm);display:flex;align-items:center;gap:6px}
.pj-cat-dot{width:8px;height:8px;border-radius:4px}
.pj-prog-wrap{margin-top:auto}
.pj-prog-bg{height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.pj-prog-fill{height:100%;border-radius:3px;transition:width .5s}
.pj-prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dm);margin-bottom:5px;font-weight:600}
.pj-next{font-size:12px;color:var(--tx);background:var(--s2);padding:8px 12px;border-radius:10px;display:flex;align-items:center;gap:6px;line-height:1.4}
.pj-next .lbl{font-size:10px;font-weight:700;color:var(--dm);letter-spacing:.5px;text-transform:uppercase;flex-shrink:0}
.pj-cd{font-size:11px;color:var(--or);font-weight:700}

/* ===== SLIDE-OUT PANEL ===== */
.pj-layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:flex-start}
.pj-layout.full{grid-template-columns:1fr}
.pj-panel{position:sticky;top:20px;border-radius:20px;padding:24px;animation:slideIn .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.pj-panel-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;color:var(--dm);border:none;font-family:inherit}
.pj-panel-x:hover{background:var(--s3);color:var(--tx)}
.pj-panel-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-right:40px}
.pj-panel-head .ico{font-size:36px}
.pj-panel-head h2{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.pj-panel-head .meta{font-size:12px;color:var(--dm);font-weight:500}
.pj-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.pj-stat{background:var(--s2);border-radius:14px;padding:14px;text-align:center}
.pj-stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em}
.pj-stat .l{font-size:10px;color:var(--dm);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.pj-sec{font-size:11px;font-weight:800;color:var(--dm);letter-spacing:1px;text-transform:uppercase;margin:18px 0 10px}
.pj-ms{display:flex;flex-direction:column;gap:8px}
.pj-ms-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--s2);border-radius:10px;font-size:13px;cursor:pointer}
.pj-ms-item .icon{font-size:14px;flex-shrink:0}
.pj-ms-item .txt{flex:1}
.pj-ms-item .dt{font-size:11px;color:var(--dm)}
.pj-ms-item.done{opacity:.6}
.pj-ms-item.done .txt{text-decoration:line-through}
.pj-na{display:flex;flex-direction:column;gap:6px}
.pj-na-item{padding:10px 14px;background:var(--s2);border-radius:10px;font-size:13px;display:flex;align-items:center;gap:10px;cursor:pointer}
.pj-na-item input[type=checkbox]{width:16px;height:16px;accent-color:#C8FF00;cursor:pointer}
.pj-na-item.done{opacity:.5}
.pj-na-item.done span{text-decoration:line-through}
.pj-fin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pj-fin-box{background:var(--s2);border-radius:12px;padding:12px}
.pj-fin-box .v{font-size:16px;font-weight:800}
.pj-fin-box .l{font-size:10px;color:var(--dm);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.pj-footer{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.pj-footer .btn{flex:1;min-width:fit-content}

/* ===== CATEGORIES IN SETTINGS ===== */
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border-radius:12px;margin-bottom:6px}
.cat-row input[type=text]{flex:1;border:none;background:transparent;font-size:13px;font-weight:600;color:var(--tx);font-family:inherit;padding:4px 0;outline:none}
.cat-row input[type=color]{width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;padding:0;background:none;flex-shrink:0}
.pj-h{padding:18px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.pj-b{padding:0 20px 18px;border-top:1px solid var(--s3);display:none}

/* ===== MODAL ===== */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.mo.show{display:flex}
.modal{background:var(--s1);border-radius:24px;width:50%;min-width:350px;max-width:700px;padding:32px;max-height:70vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.15)}
.modal h3{font-size:22px;font-weight:600;margin-bottom:18px;letter-spacing:-.02em}
.mf{margin-bottom:14px}
.mf label{font-size:13px;font-weight:500;color:var(--dm);display:block;margin-bottom:6px}
.mf input,.mf textarea,.mf select{width:100%;background:var(--s2);border:1.5px solid transparent;border-radius:14px;padding:14px 18px;color:var(--tx);font-size:17px;font-family:inherit;outline:none}
.mf input:focus,.mf textarea:focus{border-color:var(--cy)}
.mf textarea{min-height:90px;resize:vertical}
.m-btns{display:flex;gap:10px;margin-top:18px}
.m-btns .btn{flex:1;padding:16px;font-size:17px}

/* ===== UTILS ===== */
.sec{font-size:13px;font-weight:600;letter-spacing:-.01em;text-transform:none;color:var(--tx);margin:20px 0 10px;padding-left:0}
.s-item{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--s1);border-radius:14px;margin-bottom:5px;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.dz{margin-top:24px;padding-top:16px;border-top:1px solid var(--s3)}

/* ===== DASHBOARD CARDS ===== */
.dash-card{background:var(--s1);border-radius:20px;padding:18px 20px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:20px 20px 0 0}
.dc-meal::before{background:var(--gn)}.dc-wo::before{background:var(--cy)}
.dc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dc-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;letter-spacing:-.01em}
.dc-link{font-size:14px;color:var(--cy);font-weight:500;cursor:pointer}
.dc-macros{display:flex;gap:8px}
.dc-macro{text-align:center;flex:1;background:var(--s2);border-radius:12px;padding:10px 4px}
.dc-macro .dcv{font-size:18px;font-weight:700;letter-spacing:-.02em}
.dc-macro .dcl{font-size:9px;color:var(--dm);font-weight:500;text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.dc-meals-list{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.dc-ml{display:flex;justify-content:space-between;font-size:13px;padding:6px 10px;background:var(--s2);border-radius:8px}
.dc-ml .dcn{color:var(--tx);font-weight:400}.dc-ml .dcc{color:var(--dm);font-family:'SF Mono',monospace}
.dc-wo-info{font-size:15px;font-weight:500;padding:8px 12px;background:var(--s2);border-radius:12px;margin-top:6px}
.dc-wo-exlist{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.dc-wo-ex{font-size:13px;padding:6px 10px;background:var(--s2);border-radius:8px;display:flex;justify-content:space-between}
.dc-wo-ex .dn{font-weight:400}.dc-wo-ex .ds{color:var(--cy);font-family:'SF Mono',monospace}

/* ===== EPL BANNER ===== */
.sc-epl{display:flex;gap:10px;align-items:center}
.sc-rank{font-size:26px;font-weight:700;line-height:1}
.sc-rank-label{font-size:9px;opacity:.4;font-weight:500;letter-spacing:.8px;text-transform:uppercase}
.sc-match-teams{font-size:14px;font-weight:600}
.sc-match-date{font-size:11px;opacity:.4;font-weight:400}
.sc-epl-stats{display:flex;gap:8px;margin-top:4px}
.sc-epl-stat{font-size:11px;opacity:.4;font-weight:400}

/* ===== SCORE RING ===== */
.score-ring-wrap{position:relative;width:76px;height:76px}
.score-ring{transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:var(--s3);stroke-width:5}
.score-ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
.score-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-ring-num{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.02em}
.score-ring-label{font-size:9px;color:var(--dm);font-weight:400}

/* ===== REST TIMER ===== */
.rest-timer{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:90;background:var(--s1);border-radius:24px;padding:16px 28px;display:none;align-items:center;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.rest-timer.show{display:flex}
.rt-time{font-size:32px;font-weight:600;font-family:'SF Mono',monospace;min-width:60px;text-align:center;letter-spacing:-.02em}
.rt-label{font-size:12px;color:var(--dm);font-weight:500}
.rt-btn{padding:10px 18px;border-radius:12px;border:none;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px}

/* ===== BADGES ===== */
.badge-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.badge{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--s2);border:2px solid var(--s3);position:relative;transition:all .3s}
.badge.unlocked{border-color:#C8FF00;background:rgba(200,255,0,.1)}
.badge.locked{opacity:.2;filter:grayscale(1)}
.badge-tooltip{position:absolute;bottom:-18px;font-size:8px;color:var(--dm);white-space:nowrap;font-weight:500}
@keyframes badgeUnlock{0%{transform:scale(.5) rotate(-20deg)}50%{transform:scale(1.2) rotate(5deg)}100%{transform:scale(1) rotate(0)}}

/* ===== CHAT — iMessage ===== */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 160px)}
.chat-msgs{flex:1;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:80%;padding:12px 18px;border-radius:20px;font-size:15px;line-height:1.5;word-wrap:break-word}
.chat-msg.user{align-self:flex-end;background:var(--cy);color:#fff}
.chat-msg.bot{align-self:flex-start;background:var(--s2)}
.chat-msg.typing{color:var(--dm);font-style:italic}
.chat-input-wrap{display:flex;gap:10px;padding:12px 0 0;border-top:1px solid var(--s3);margin-top:8px}
.chat-input{flex:1;background:var(--s2);border:none;border-radius:22px;padding:12px 18px;color:var(--tx);font-size:15px;font-family:inherit;outline:none;resize:none;min-height:44px;max-height:100px}
.chat-input:focus{box-shadow:0 0 0 2px var(--cy)}
.chat-send{padding:12px 20px;border-radius:22px;border:none;background:var(--tx);color:#fff;font-weight:600;font-size:15px;cursor:pointer;font-family:inherit}

/* ===== COUNTDOWN ===== */
.countdown-card{background:var(--s1);border-radius:20px;padding:20px;margin-bottom:12px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.cd-goals{display:flex;gap:10px;flex-wrap:wrap}
.cd-goal{flex:1;min-width:90px;background:var(--s2);border-radius:14px;padding:14px;text-align:center}
.cd-goal .cd-days{font-size:28px;font-weight:700;letter-spacing:-.03em}
.cd-goal .cd-glabel{font-size:11px;color:var(--dm);margin-top:4px;font-weight:500}


/* ===== SCORE PAGE 2-COL ===== */
#scoreGrid{display:grid;grid-template-columns:1fr;gap:14px}
.sc-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.sc-card{background:var(--s1);border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);min-height:0;padding:18px}
.sc-h1{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--tx)}
.sc-h-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sc-habit-row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;cursor:pointer;-webkit-user-select:none;transition:background .15s}
.sc-habit-row+.sc-habit-row{margin-top:5px}
/* Day tasks Sáng/Chiều/Tối */
.dt-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;flex:1;min-height:0}
.dt-col{background:var(--s2);border-radius:14px;padding:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.dt-col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-shrink:0}
.dt-col-t{font-size:13px;font-weight:700;color:var(--tx);letter-spacing:.3px}
.dt-col-add{width:22px;height:22px;border-radius:50%;background:#C8FF00;color:#1d1d1f;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;font-size:14px;border:none}
.dt-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;min-height:80px}
.dt-task{background:var(--s1);border-radius:9px;padding:8px 10px;display:flex;gap:7px;align-items:flex-start;font-size:12px;cursor:pointer;border-left:3px solid var(--mt)}
.dt-task.done{opacity:.55}
.dt-task.done .dt-task-name{text-decoration:line-through;color:var(--mt)}
.dt-cb{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--mt);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dt-cb.checked{background:#C8FF00;border-color:#C8FF00}
.dt-task-name{flex:1;line-height:1.35;word-break:break-word;white-space:normal;color:var(--tx)}
.dt-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;color:#fff;margin-right:4px;letter-spacing:.2px}
.dt-x{color:var(--mt);font-size:11px;cursor:pointer;flex-shrink:0;padding:2px}
.dt-x:hover{color:var(--rd)}
.dt-add-form{background:var(--s1);border-radius:9px;padding:8px;display:none;flex-direction:column;gap:5px;margin-bottom:5px}
.dt-add-form.show{display:flex}
.dt-add-form input{background:var(--s2);border:none;border-radius:6px;padding:7px 9px;font-size:12px;font-family:inherit;outline:none;color:var(--tx)}
.dt-tag-picker{display:flex;flex-wrap:wrap;gap:3px;max-height:60px;overflow-y:auto}
.dt-tag-opt{padding:3px 7px;border-radius:5px;font-size:10px;font-weight:700;color:#fff;cursor:pointer;opacity:.6;transition:opacity .15s}
.dt-tag-opt.sel{opacity:1;outline:2px solid var(--tx)}
.dt-add-btns{display:flex;gap:4px}
.dt-add-btns button{flex:1;padding:6px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
/* GLASS CARD reusable */
.glass{background:rgba(255,255,255,.62);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-radius:20px;border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 28px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05),inset 0 1px 0 rgba(255,255,255,.85)}
/* HEALTH sub-tabs */
.h-tabs{display:flex;gap:6px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:5px;margin-bottom:14px;width:fit-content;border:1px solid rgba(255,255,255,.7);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.h-tab{padding:9px 18px;border:none;background:transparent;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--dm);transition:all .2s}
.h-tab.a{background:linear-gradient(180deg,#D8FF1F 0%,#C8FF00 100%);color:#1d1d1f;box-shadow:0 2px 8px rgba(200,255,0,.4)}
.h-tab:hover:not(.a){background:rgba(255,255,255,.5);color:var(--tx)}
/* Workout horizontal */
.wo-grid{display:grid;grid-template-columns:1fr;gap:14px}
/* Meal grid */
.ml-grid{display:grid;grid-template-columns:1fr;gap:14px}
.ml-h1{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--tx);margin-bottom:12px}
.ml-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ml-summary-box{background:var(--s2);border-radius:12px;padding:12px;text-align:center}
.ml-summary-val{font-size:22px;font-weight:800;letter-spacing:-.02em}
.ml-summary-lbl{font-size:10px;color:var(--dm);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.ml-summary-diff{font-size:10px;font-weight:600;margin-top:2px}
@media(min-width:768px){
  #scoreGrid{grid-template-columns:42fr 58fr;gap:18px;align-items:start;min-height:calc(100vh - 180px)}
  .sc-card.flex-grow{flex:1;min-height:280px;display:flex;flex-direction:column}
  #heroArea{display:none}
  .ml-grid{grid-template-columns:1fr 1.3fr;gap:18px;align-items:start}
  .ml-summary-grid{grid-template-columns:repeat(4,1fr)}
  .wo-grid{grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
}
@media(max-width:767px){
  .sc-card{margin-bottom:0}
  .dt-grid{grid-template-columns:1fr;gap:8px}
}

/* ===== GOAL TIMELINE ===== */
.gt-wrap{background:rgba(255,255,255,.6);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:24px;padding:20px;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.gt-wrap::before{content:'';position:absolute;inset:0;border-radius:24px;border:1px solid rgba(255,255,255,.8);pointer-events:none}
.gt-wrap::after{content:'';position:absolute;top:-50%;left:-20%;width:140%;height:100%;background:radial-gradient(ellipse at 30% 0%,rgba(200,255,0,.06),transparent 50%),radial-gradient(ellipse at 70% 100%,rgba(0,113,227,.04),transparent 50%);pointer-events:none}
.gt-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:1}
.gt-title{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--dm)}
.gt-q{font-size:13px;font-weight:600;color:var(--tx)}
.gt-svg{width:100%;position:relative;z-index:1}
.gt-node{cursor:pointer;transition:all .3s}
.gt-node:hover .gt-card{transform:scale(1.03)}
.gt-node:hover .gt-glow{opacity:.6}
.gt-card{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.gt-glow{transition:opacity .3s}
.gt-pulse{animation:gtPulse 2s ease-in-out infinite}
@keyframes gtPulse{0%,100%{opacity:.3}50%{opacity:.7}}
.gt-info{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-radius:24px}
.gt-info.show{display:flex}
.gt-info-card{text-align:center;padding:24px}
.gt-info-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}


/* ===== RIVER TIMELINE ===== */
.rt-scene{position:relative;width:100%;aspect-ratio:16/9;max-height:320px;border-radius:20px;overflow:hidden;background:#f0f1f5}
.rt-blizzard{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.rt-aurora{position:absolute;width:160%;height:160%;top:-30%;left:-30%;background:radial-gradient(ellipse at 25% 20%,rgba(180,200,255,.25),transparent 50%),radial-gradient(ellipse at 75% 70%,rgba(255,200,160,.15),transparent 50%),radial-gradient(ellipse at 50% 50%,rgba(200,180,255,.1),transparent 60%);animation:rtAurora 12s ease-in-out infinite alternate}
@keyframes rtAurora{0%{transform:translate(0,0)}50%{transform:translate(-3%,2%)}100%{transform:translate(2%,-2%)}}
.rt-snow{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.6);border-radius:50%;animation:rtSnow linear infinite}
@keyframes rtSnow{0%{transform:translateY(-20px);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translateY(400px) translateX(30px);opacity:0}}
.rt-glass{position:absolute;inset:6px;border-radius:16px;background:rgba(255,255,255,.35);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.6)}
.rt-glass::before{content:'';position:absolute;top:0;left:10%;width:80%;height:35%;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent);border-radius:16px 16px 50% 50%;pointer-events:none}
.rt-svg{position:absolute;inset:6px;z-index:2}
.rt-blob{cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.rt-blob:hover{transform:scale(1.06)}
@keyframes rtRiver1{to{stroke-dashoffset:-60}}
@keyframes rtRiver2{to{stroke-dashoffset:-40}}
.rt-overlay{position:absolute;inset:6px;border-radius:16px;display:none;align-items:center;justify-content:center;z-index:10;background:rgba(240,241,245,.88);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}

// Đảm bảo mọi project có: category, milestones[], nextActions[], progress, capital, margin, urgent, pinScore
// Migrate legacy status: green→in_progress, yellow→in_progress (with urgent=true), red→in_progress (with urgent=true)
(function migrateProjects(){
  let changed=false;
  const legacyMap={green:'in_progress',yellow:'in_progress',red:'in_progress'};
  projects.forEach(p=>{
    if(p.category===undefined){p.category=projectCategories[0].id;changed=true}
    if(!Array.isArray(p.milestones)){p.milestones=[];changed=true}
    if(!Array.isArray(p.nextActions)){p.nextActions=[];changed=true}
    if(typeof p.progress!=='number'){p.progress=0;changed=true}
    if(p.capital===undefined){p.capital='';changed=true}
    if(p.margin===undefined){p.margin='';changed=true}
    if(p.urgent===undefined){
      // Legacy yellow/red → mark as urgent
      p.urgent=(p.status==='yellow'||p.status==='red');
      changed=true;
    }
    if(p.pinScore===undefined){p.pinScore=false;changed=true}
    if(legacyMap[p.status]){p.status=legacyMap[p.status];changed=true}
    if(!p.status||!STATUS.find(s=>s.v===p.status)){p.status='not_started';changed=true}
  });
  if(changed)sv('projects',projects);
})();

function smoothBlob(cx,cy,r,seed){
  const pts=6;const points=[];
  for(let i=0;i<pts;i++){const a=(i/pts)*Math.PI*2;const rr=r+Math.sin(seed+i*2.1)*r*.25+Math.cos(seed*1.5+i*1.3)*r*.18;
    points.push({x:cx+rr*Math.cos(a),y:cy+rr*Math.sin(a)})}
  let d=`M${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
  for(let i=0;i<pts;i++){const p1=points[(i+1)%pts],p2=points[(i+2)%pts];
    d+=`Q${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${((p1.x+p2.x)/2).toFixed(1)},${((p1.y+p2.y)/2).toFixed(1)}`}
  return d+'Z'}

    svg+=`<text x="${g.cx}" y="${g.cy-blobR-8}" text-anchor="middle" font-size="10" fill="rgba(0,0,0,.3)" font-family="-apple-system,sans-serif">goal</text>`;

    const chipX=g.cx+blobR*.5,chipY=g.cy-blobR*.5;
    svg+=`<circle cx="${chipX}" cy="${chipY}" r="10" fill="${g.color[1]}" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>`;

    svg+=`</g>`});

// ===== ARC HELPER =====

function describeArc(cx,cy,r,startAngle,endAngle){
  const s=startAngle*Math.PI/180,e=endAngle*Math.PI/180;
  const sx=cx+r*Math.cos(s),sy=cy-r*Math.sin(s);
  const ex=cx+r*Math.cos(e),ey=cy-r*Math.sin(e);
  const large=Math.abs(startAngle-endAngle)>180?1:0;
  return'M '+sx+' '+sy+' A '+r+' '+r+' 0 '+large+' 1 '+ex+' '+ey}

function rCalRoadmap(c){
  const now=new Date();
  const monthsBack=roadmapCfg.monthsBack||0;
  const monthsAhead=roadmapCfg.monthsAhead||18;
  const startMonth=new Date(now.getFullYear(),now.getMonth()-monthsBack,1);
  const totalMonths=monthsBack+monthsAhead+1;
  const monthLabels=['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'];
  const colWidth=120; // px per month
  
  // Build month columns
  const months=[];
  for(let i=0;i<totalMonths;i++){
    const d=new Date(startMonth.getFullYear(),startMonth.getMonth()+i,1);
    months.push({y:d.getFullYear(),m:d.getMonth(),isCur:d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()});
  }
  
  if(!projects.length){
    c.innerHTML=`<div class="glass" style="padding:18px"><div class="rm-empty"><div style="font-size:40px;margin-bottom:10px">🛣️</div><div>Chưa có dự án nào để hiển thị trên roadmap</div><div style="font-size:12px;margin-top:6px">Sang tab Projects để thêm</div></div></div>`;
    return;
  }
  
  let h=`<div class="glass rm-wrap"><div class="rm-scroll"><div class="rm-grid" style="grid-template-columns:140px repeat(${totalMonths},${colWidth}px)">`;
  
  // Header row
  h+=`<div class="rm-fixed-col head">Project</div>`;
  months.forEach(mo=>{
    h+=`<div class="rm-month-label${mo.isCur?' cur':''}">${monthLabels[mo.m]} ${String(mo.y).slice(2)}</div>`;
  });
  
  // Calculate today's offset (in px from start of grid)
  const msPerDay=86400000;
  const totalDaysInRange=(months.length>0)?
    (new Date(months[months.length-1].y,months[months.length-1].m+1,0)-startMonth)/msPerDay:0;
  const daysToToday=(now-startMonth)/msPerDay;
  const todayPct=daysToToday/totalDaysInRange;
  const gridWidth=totalMonths*colWidth;
  const todayLeft=140+gridWidth*todayPct;
  
  // Project rows (skip 'done' — only Projects tab shows them)
  // Build list with original index preserved for openProjPanel callbacks
  const visibleProjects=projects.map((p,origIdx)=>({p,origIdx})).filter(x=>x.p.status!=='done');
  
  if(!visibleProjects.length){
    c.innerHTML=`<div class="glass" style="padding:18px"><div class="rm-empty"><div style="font-size:40px;margin-bottom:10px">🛣️</div><div>Chưa có dự án đang triển khai</div><div style="font-size:12px;margin-top:6px">Sang tab Projects để thêm hoặc kích hoạt</div></div></div>`;
    return;
  }
  
  visibleProjects.forEach(({p})=>{
    const cat=projectCategories.find(x=>x.id===p.category);
    const color=cat?cat.color:(p.color||'#0071e3');
    
    h+=`<div class="rm-fixed-col"><span style="font-size:18px">${p.icon}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1" title="${p.name}">${p.name}</span>${p.urgent?'<span style="font-size:13px" title="Gấp">🚩</span>':''}</div>`;
    
    // One cell per month for this project — bar overlays
    months.forEach((mo,mi)=>{
      h+=`<div class="rm-cell"></div>`;
    });
  });
  
  h+=`</div>`;
  
  // Now overlay bars + milestones absolutely on top of grid
  let overlay=`<div style="position:absolute;top:0;left:140px;right:0;bottom:0;pointer-events:none">`;
  
  visibleProjects.forEach(({p,origIdx},rowIdx)=>{
    const cat=projectCategories.find(x=>x.id===p.category);
    const color=cat?cat.color:(p.color||'#0071e3');
    const rowTop=40+rowIdx*48; // header 40px + row 48px each (approx)
    
    let barLeft,barWidth,striped=false;
    if(p.startDate&&p.endDate){
      const sd=new Date(p.startDate+'T00:00:00');
      const ed=new Date(p.endDate+'T00:00:00');
      const sdOff=Math.max(0,(sd-startMonth)/msPerDay);
      const edOff=Math.max(0,(ed-startMonth)/msPerDay);
      barLeft=(sdOff/totalDaysInRange)*gridWidth;
      barWidth=Math.max(20,((edOff-sdOff)/totalDaysInRange)*gridWidth);
    }else{
      // No deadline — striped rolling commitment from start to end of range
      barLeft=0;
      barWidth=gridWidth;
      striped=true;
    }
    
    // Skip if completely out of range
    if(barLeft>gridWidth)return;
    if(barLeft+barWidth<0)return;
    if(barLeft<0){barWidth+=barLeft;barLeft=0}
    if(barLeft+barWidth>gridWidth)barWidth=gridWidth-barLeft;
    
    overlay+=`<div class="rm-bar${striped?' striped':''}" style="left:${barLeft}px;width:${barWidth}px;top:${rowTop}px;background:${color};pointer-events:auto" onclick="openProjPanel(${origIdx})">${p.icon} ${p.name}${p.urgent?' 🚩':''}</div>`;
    
    // Milestones
    (p.milestones||[]).forEach(ms=>{
      if(!ms.date)return;
      const md=new Date(ms.date+'T00:00:00');
      const mdOff=(md-startMonth)/msPerDay;
      if(mdOff<0||mdOff>totalDaysInRange)return;
      const left=(mdOff/totalDaysInRange)*gridWidth;
      const sym=ms.type==='launch'?'🚀':ms.type==='goal'?'🎯':'◆';
      const symColor=ms.type==='launch'?'#ff9500':ms.type==='goal'?'#34c759':color;
      overlay+=`<span class="rm-milestone" style="left:${left-7}px;top:${rowTop+6}px;color:${symColor};pointer-events:auto" title="${ms.name||''} (${ms.date})">${sym}</span>`;
    });
  });
  
  // Today line
  if(todayPct>=0&&todayPct<=1){
    overlay+=`<div class="rm-today" style="left:${gridWidth*todayPct}px"></div>`;
  }
  overlay+=`</div>`;
  
  h+=overlay;
  h+=`</div>`; // /rm-scroll
  
  // Legend
  h+=`<div class="rm-legend">`;
  projectCategories.forEach(cat=>{
    h+=`<div class="rm-legend-item"><div class="rm-legend-dot" style="background:${cat.color}"></div><span>${cat.name}</span></div>`;
  });
  h+=`<div class="rm-legend-item"><span>◆ Milestone</span></div>`;
  h+=`<div class="rm-legend-item"><span>🚀 Launch</span></div>`;
  h+=`<div class="rm-legend-item"><span>🎯 Goal</span></div>`;
  h+=`<div class="rm-legend-item"><span style="display:inline-block;width:14px;height:14px;background-image:repeating-linear-gradient(45deg,#999 0,#999 4px,transparent 4px,transparent 8px);border-radius:7px;border:1px solid #ccc"></span><span>Rolling (no deadline)</span></div>`;
  h+=`</div></div>`;
  
  c.innerHTML=h;
  
  // Scroll to today on first render
  setTimeout(()=>{
    const sc=c.querySelector('.rm-scroll');
    if(sc&&todayLeft>0){
      sc.scrollLeft=Math.max(0,todayLeft-sc.clientWidth/2);
    }
  },50);
}

// ===== MEAL (PLAN + TRACKER + WATER) =====
let mealDate=td();
let macroLog=ld('macroLog',{});// {date: {cal,p,c,f}}
function rMeal(target){const c=target||document.getElementById('hContent')||document.getElementById('pg-meal');if(!c)return;const t=mealDate;
  const isToday=t===td();
  const dObj=new Date(t+'T00:00:00');
  const dateLabel=`${DN[dObj.getDay()]} ${dObj.getDate()}/${dObj.getMonth()+1}`;
  const log=macroLog[t]||{cal:0,p:0,c:0,f:0};
  const wt=waterLog[t]||0;
  const dc=(v,tg)=>v<=tg?'var(--gn)':'var(--rd)',dp=(v,tg)=>v>=tg?'var(--gn)':'var(--rd)';
  const diff=(v,tg)=>(v-tg>=0?'+':'')+(v-tg);

  let h=`<div class="glass" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:12px 18px">
    <button class="btn btn-cy" onclick="mealNav(-1)">◀</button>
    <div style="text-align:center;cursor:pointer" onclick="mealToday()">
      <div style="font-size:20px;font-weight:800;letter-spacing:-.02em">${dateLabel}</div>
      <div style="font-size:11px;color:${isToday?'var(--gn)':'var(--dm)'};font-weight:600">${isToday?'● Hôm nay':'Tap để về hôm nay'}</div>
    </div>
    <button class="btn btn-cy" onclick="mealNav(1)">▶</button>
  </div>`;

  h+=`<div class="ml-grid">`;

  // LEFT: Summary + Progress + Water
  let leftHtml=`<div class="glass" style="padding:18px;margin-bottom:14px"><div class="ml-h1">📊 Tổng ngày</div><div class="ml-summary-grid">
      <div class="ml-summary-box"><div class="ml-summary-val" style="color:var(--cy)">${log.cal}</div><div class="ml-summary-lbl">Kcal</div><div class="ml-summary-diff" style="color:${dc(log.cal,MAC.cal)}">${diff(log.cal,MAC.cal)}</div></div>
      <div class="ml-summary-box"><div class="ml-summary-val" style="color:var(--gn)">${log.p}<span style="font-size:13px;color:var(--dm)">g</span></div><div class="ml-summary-lbl">Protein</div><div class="ml-summary-diff" style="color:${dp(log.p,MAC.p)}">${diff(log.p,MAC.p)}</div></div>
      <div class="ml-summary-box"><div class="ml-summary-val" style="color:var(--or)">${log.c}<span style="font-size:13px;color:var(--dm)">g</span></div><div class="ml-summary-lbl">Carb</div><div class="ml-summary-diff" style="color:${dc(log.c,MAC.c)}">${diff(log.c,MAC.c)}</div></div>
      <div class="ml-summary-box"><div class="ml-summary-val" style="color:var(--rd)">${log.f}<span style="font-size:13px;color:var(--dm)">g</span></div><div class="ml-summary-lbl">Fat</div><div class="ml-summary-diff" style="color:${dc(log.f,MAC.f)}">${diff(log.f,MAC.f)}</div></div>
    </div><div style="font-size:11px;color:var(--dm);margin-top:6px">Mục tiêu: ${MAC.cal}kcal · ${MAC.p}P · ${MAC.c}C · ${MAC.f}F</div></div>`;
  leftHtml+=`<div class="glass" style="padding:18px;margin-bottom:14px"><div class="ml-h1">📈 Tiến độ</div>`;
  [{l:'Calo',c:log.cal,t:MAC.cal,co:'var(--cy)'},{l:'Protein',c:log.p,t:MAC.p,co:'var(--gn)'},{l:'Carb',c:log.c,t:MAC.c,co:'var(--or)'},{l:'Fat',c:log.f,t:MAC.f,co:'var(--rd)'}].forEach(b=>{
    const pct=Math.min(Math.round(b.c/b.t*100),200);
    leftHtml+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:50px;font-size:12px;font-weight:600;color:var(--dm)">${b.l}</div><div style="flex:1;height:8px;background:var(--s2);border-radius:4px;overflow:hidden"><div style="height:100%;width:${Math.min(pct,100)}%;background:${pct>110?'var(--rd)':b.co};border-radius:4px;transition:width .4s"></div></div><div style="width:42px;text-align:right;font-size:12px;font-weight:700;color:${b.co}">${pct}%</div></div>`});
  leftHtml+=`<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--s3)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div style="font-size:13px;font-weight:700">💧 Nước</div><div style="font-size:12px;color:var(--dm);font-weight:600">${wt}/6 bình</div></div><div style="display:flex;gap:6px">${Array.from({length:6},(_,i)=>`<div onclick="setWater(${i+1})" style="flex:1;aspect-ratio:1;background:${i<wt?'rgba(0,113,227,.15)':'var(--s2)'};border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;color:${i<wt?'var(--cy)':'var(--mt)'}">${i<wt?'💧':'○'}</div>`).join('')}</div></div>`;
  leftHtml+=`</div>`;

  // RIGHT: Macro input + Meal plan tuần
  let rightHtml=`<div class="glass" style="padding:18px;margin-bottom:14px">
    <div class="ml-h1">✍️ Nhập macro hôm nay</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="mf"><label>Kcal</label><input id="mCal" type="number" value="${log.cal||''}" placeholder="0" style="font-size:18px;font-weight:700;color:var(--cy)"></div>
      <div class="mf"><label>Protein (g)</label><input id="mPr" type="number" value="${log.p||''}" placeholder="0" style="font-size:18px;font-weight:700;color:var(--gn)"></div>
      <div class="mf"><label>Carb (g)</label><input id="mCr" type="number" value="${log.c||''}" placeholder="0" style="font-size:18px;font-weight:700;color:var(--or)"></div>
      <div class="mf"><label>Fat (g)</label><input id="mFt" type="number" value="${log.f||''}" placeholder="0" style="font-size:18px;font-weight:700;color:var(--rd)"></div>
    </div>
    <button class="btn btn-gn btn-full" onclick="saveMacro()" style="margin-top:8px;font-weight:700">💾 Lưu</button>
    ${log.cal>0?'<button class="btn btn-rd btn-full" onclick="clearMacro()" style="margin-top:4px">Xoá</button>':''}
  </div>`;
  rightHtml+=`<div class="glass" style="padding:18px"><div class="ml-h1">🍱 Meal Plan tuần</div>`;
  const dayOrder=["T2","T3","T4","T5","T6","T7","CN"];
  dayOrder.forEach(d=>{const ml=getMeals(d);
    const tot={k:0,p:0,c:0,f:0};ml.forEach(m=>{tot.k+=m.k;tot.p+=m.p;tot.c+=m.c;tot.f+=m.f});
    rightHtml+=`<div class="mp-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')"><div><span style="font-weight:700;font-size:14px">${d}</span></div><span class="mono" style="font-size:11px;color:var(--dm)">${tot.k}kcal · ${tot.p}P · ${tot.c}C · ${tot.f}F</span></div>`;
    rightHtml+=`<div class="mp-body">`;
    ml.forEach((m,i)=>rightHtml+=`<div onclick="editMl('${d}',${i})" style="padding:7px 0;border-bottom:1px solid var(--s3);cursor:pointer"><div style="display:flex;justify-content:space-between;align-items:flex-start"><div><span style="font-size:10px;color:var(--cy);font-weight:700">${m.t}</span><br><span style="font-size:12px">${m.n}</span></div><div class="mono" style="font-size:10px;color:var(--dm);text-align:right;white-space:nowrap">${m.k}kcal<br><span style="color:var(--gn)">${m.p}P</span> · <span style="color:var(--or)">${m.c}C</span> · <span style="color:var(--rd)">${m.f}F</span></div></div></div>`);
    rightHtml+=`<div style="font-size:9px;color:var(--mt);padding-top:4px">Tap bữa để sửa</div></div>`});
  rightHtml+=`</div>`;

  h+=`<div>${leftHtml}</div><div>${rightHtml}</div></div>`;
  c.innerHTML=h;
}

window.mealNav=dir=>{const d=new Date(mealDate+'T00:00:00');d.setDate(d.getDate()+dir);mealDate=ds(d);rMeal()};

// ===== WORKOUT (FULL V3 STRUCTURE) =====
// ===== WEIGHT LOG (per-day per-exercise) =====
// Format: { 'YYYY-MM-DD': { 'exKey': {w:80,r:5,n:'Squat'}, ... } }
// where exKey = `${woType}_${sec}_${idx}`
let weightLog=ld('weightLog',{});

function rWo(target){const c=target||document.getElementById('hContent')||document.getElementById('pg-wo');if(!c)return;
  const today=td();
  const dayLog=weightLog[today]||{};
  
  let h='<div class="glass" style="padding:14px 18px;margin-bottom:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div style="font-size:13px;font-weight:700;color:var(--dm);margin-right:6px">Buổi tập:</div>';
  // Build buttons from current week schedule (gymSch) — show only days that have workouts assigned
  const sch=getGymSch();
  const dayOrder=['T2','T3','T4','T5','T6','T7','CN'];
  const woEmoji={T2:'💪',T4:'🔙',T6:'🦵',T7:'🏀'};
  const woName={T2:'Push',T4:'Pull',T6:'Legs',T7:'BB'};
  const scheduledDays=dayOrder.filter(d=>sch[d]&&WO_DATA[sch[d]]);
  // Make sure current selected woT matches a scheduled day's workout — if not, switch to first scheduled
  if(scheduledDays.length){
    const validTypes=scheduledDays.map(d=>sch[d]);
    if(!validTypes.includes(woT)){woT=validTypes[0];sv('woT',woT)}
  }
  scheduledDays.forEach(d=>{
    const wt=sch[d]; // workout type (T2/T4/T6/T7)
    const isActive=wt===woT;
    h+=`<button onclick="sWo('${wt}')" style="padding:8px 14px;border-radius:11px;border:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;background:${isActive?'#C8FF00':'rgba(255,255,255,.6)'};color:${isActive?'#1d1d1f':'var(--tx)'};box-shadow:${isActive?'0 2px 8px rgba(200,255,0,.4)':'none'};display:flex;align-items:center;gap:5px"><span style="font-weight:800">${d}</span><span style="opacity:.7;font-size:11px">${woEmoji[wt]||''} ${woName[wt]||wt}</span></button>`;
  });
  if(!scheduledDays.length){
    h+=`<div style="font-size:12px;color:var(--mt);font-style:italic">Tuần này chưa có lịch tập — bấm "Sửa lịch tuần" để lên lịch</div>`;
  }
  h+=`<button onclick="editGymSch()" style="margin-left:auto;padding:8px 14px;border-radius:11px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;background:var(--s2);color:var(--tx)">📅 Sửa lịch tuần</button>`;
  h+='</div>';
  
  if(!scheduledDays.length){c.innerHTML=h;return}
  const wo=getWo(woT);if(!wo){c.innerHTML=h+'<div class="glass" style="padding:30px;text-align:center;color:var(--mt)">Chọn ngày tập</div>';return}
  h+=`<div class="glass" style="padding:18px 22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:24px;font-weight:800;letter-spacing:-.02em">${wo.ti}</div><div style="font-size:13px;color:var(--dm);margin-top:2px;font-weight:500">⏱️ ${wo.tm} · 📋 Nhập mức tạ vào ô bên cạnh từng bài chính</div></div><button class="btn btn-cy" onclick="editWoTitle('${woT}')">✎ Sửa</button></div>`;
  h+='<div class="wo-grid">';
  // Khởi động
  h+=`<div class="glass" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:16px;font-weight:800;color:#cc9900">▸ Khởi động</div><div style="font-size:11px;color:var(--dm);font-weight:600">${wo.w.length} bài</div></div>`;
  wo.w.forEach((e,i)=>h+=`<div onclick="editWoEx('${woT}','w',${i})" style="background:rgba(255,204,0,.08);border-left:3px solid #ffcc00;border-radius:10px;padding:11px 13px;margin-bottom:6px;cursor:pointer"><div style="font-size:13px;font-weight:600;color:var(--tx)">${e.n}</div><div style="font-size:11px;color:#cc9900;font-weight:600;margin-top:2px">${e.s}</div></div>`);
  h+=`<button class="btn btn-cy btn-full" style="font-size:11px;margin-top:6px" onclick="addWoEx('${woT}','w')">+ Thêm khởi động</button></div>`;
  
  // Bài chính — có ô nhập tạ
  h+=`<div class="glass" style="padding:18px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:16px;font-weight:800;color:var(--cy)">▸ Bài chính</div><div style="font-size:11px;color:var(--dm);font-weight:600">${wo.x.length} bài</div></div>`;
  wo.x.forEach((e,i)=>{
    const exKey=`${woT}_x_${i}`;
    const log=dayLog[exKey]||{w:'',r:''};
    h+=`<div style="background:rgba(0,113,227,.08);border-left:3px solid var(--cy);border-radius:10px;padding:11px 13px;margin-bottom:6px">
      <div onclick="editWoEx('${woT}','x',${i})" style="cursor:pointer">
        <div style="font-size:13px;font-weight:700;color:var(--tx)">${i+1}. ${e.n}</div>
        <div style="font-size:11px;color:var(--cy);font-weight:600;margin-top:3px">${e.s}${e.rs?' · Rest '+e.rs:''}</div>
        ${e.m?`<div style="font-size:10px;color:var(--mt);margin-top:3px">💪 ${e.m}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,113,227,.2)">
        <span style="font-size:10px;color:var(--dm);font-weight:700">📋 Hôm nay:</span>
        <input type="number" placeholder="kg" value="${log.w||''}" id="wlex_${exKey}_w" onblur="saveExWeight('${exKey}','${e.n.replace(/'/g,'')}')" onkeydown="if(event.key==='Enter')this.blur()" style="width:70px;padding:5px 7px;border:1.5px solid var(--s3);border-radius:7px;font-size:12px;font-weight:700;color:var(--cy);background:#fff;font-family:inherit;outline:none;text-align:center">
        <span style="font-size:11px;color:var(--mt);font-weight:600">kg</span>
        <span id="wlex_${exKey}_st" style="font-size:10px;color:var(--mt);margin-left:auto;font-weight:600"></span>
      </div>
    </div>`;
  });

// ===== Per-exercise weight log save (auto-save on blur, weight only) =====
window.saveExWeight=(exKey,exName)=>{
  const today=td();
  const wEl=document.getElementById('wlex_'+exKey+'_w');
  const stEl=document.getElementById('wlex_'+exKey+'_st');
  if(!wEl)return;
  const w=parseFloat(wEl.value);
  if(!weightLog[today])weightLog[today]={};
  const prev=weightLog[today][exKey];
  if(isNaN(w)){
    if(prev){
      delete weightLog[today][exKey];
      if(!Object.keys(weightLog[today]).length)delete weightLog[today];
      sv('weightLog',weightLog);
      if(stEl){stEl.textContent='🗑️ Đã xoá';stEl.style.color='var(--mt)';setTimeout(()=>{if(stEl)stEl.textContent=''},1500)}
    }
    return;
  }
  // Only re-save if value changed
  if(prev&&prev.w===w&&prev.n===exName)return;
  weightLog[today][exKey]={w:w,r:0,n:exName};
  sv('weightLog',weightLog);
  if(stEl){stEl.textContent='✓ Đã lưu';stEl.style.color='var(--gn)';setTimeout(()=>{if(stEl)stEl.textContent=''},1500)}
};

      if(v.p.status==='done')return 4;

      if(v.p.status==='in_progress')return 1;

    // Next action

    h+=`<div class="glass ${cardCls}" style="border-left-color:${color}" onclick="openProjPanel(${i})">

      <span class="pj-urgent-flag ${p.urgent?'on':'off'}" onclick="event.stopPropagation();toggleUrgent(${i})" title="${p.urgent?'Bỏ đánh dấu gấp':'Đánh dấu gấp'}">🚩</span>
      <div class="pj-card-head" style="padding-right:60px">
        <div class="pj-card-title"><span class="ico">${p.icon}</span><span class="nm">${p.name}</span></div>
        <span class="pj-pill ${pillCls}">${pillText}</span>
      </div>
      <div class="pj-cat-tag"><span class="pj-cat-dot" style="background:${color}"></span>${cat?cat.name:'Uncategorized'}${cdTxt?` <span class="pj-cd" style="margin-left:6px">${cdTxt}</span>`:''}</div>`;
    
    if(nextAct&&!isDone)h+=`<div class="pj-next"><span class="lbl">Next:</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${nextAct.text}</span></div>`;
    
    h+=`<div class="pj-prog-wrap">
      <div class="pj-prog-lbl"><span>Progress</span><span>${prog}%</span></div>
      <div class="pj-prog-bg"><div class="pj-prog-fill" style="width:${prog}%;background:${color}"></div></div>
    </div></div>`;
  });
  h+=`</div>`;
  
  // RIGHT: slide-out panel
  if(hasPanel){
    const p=projects[_activeProj];const i=_activeProj;
    const cat=projectCategories.find(x=>x.id===p.category);
    const color=cat?cat.color:(p.color||'#0071e3');

    const doneMs=milestones.filter(m=>m.done).length;
    const doneNa=nextActions.filter(a=>a.done).length;
    
    let cdTxt='—';
    if(p.endDate){
      const ed=new Date(p.endDate+'T00:00:00');
      const days=Math.ceil((ed-new Date())/86400000);
      cdTxt=days>0?`${days} ngày`:days===0?`Hôm nay`:`Quá ${-days}d`;
    }
    
    h+=`<div class="glass pj-panel" style="border-left:4px solid ${color}">
      <button class="pj-panel-x" onclick="closeProjPanel()">✕</button>
      <div class="pj-panel-head">
        <span class="ico">${p.icon}</span>
        <div style="flex:1;min-width:0">
          <h2>${p.name}</h2>
          <div class="meta">${cat?cat.name:'Uncategorized'} · ${st.d} ${st.l}</div>
        </div>
      </div>
      
      <div class="pj-stats">
        <div class="pj-stat"><div class="v" style="color:${color}">${prog}%</div><div class="l">Progress</div></div>

        <div class="pj-stat"><div class="v" style="color:var(--or)">${cdTxt}</div><div class="l">Còn lại</div></div>
      </div>
      
      <div class="pj-prog-wrap" style="margin-bottom:6px">
        <div class="pj-prog-bg" style="height:8px"><div class="pj-prog-fill" style="width:${prog}%;background:${color};height:8px"></div></div>

      <div class="pj-sec">📅 Timeline</div>

        </div>
      </div>
      
      <div class="pj-sec">📍 Milestones</div>
      <div class="pj-ms">`;
    if(milestones.length){
      milestones.forEach((ms,mi)=>{
        const sym=ms.done?'●':ms.type==='launch'?'🚀':ms.type==='goal'?'🎯':'◆';
        h+=`<div class="pj-ms-item${ms.done?' done':''}">

      h+=`<div style="font-size:12px;color:var(--mt);padding:8px 0">Chưa có milestone nào</div>`;
    }
    h+=`<button class="btn btn-cy" style="font-size:12px;margin-top:6px" onclick="addMilestone(${i})">+ Milestone</button></div>`;
    
    // Notes — large inline textarea
    h+=`<div class="pj-sec">📝 Notes / Ghi chú</div>
      <textarea id="pjNote_${i}" oninput="updateProjNote(${i},this.value)" placeholder="Ghi chú về dự án này — ý tưởng, todo list, link tài liệu..." style="width:100%;min-height:140px;padding:12px 14px;border:1.5px solid var(--s3);border-radius:12px;font-size:13px;font-family:inherit;background:#fff;color:var(--tx);outline:none;line-height:1.6;resize:vertical">${p.note||''}</textarea>`;

      </div>`;

    h+=`<div class="pj-footer">

      <button class="btn btn-rd" onclick="delProj(${i})">🗑️ Xoá</button>
    </div>
    
    <div style="display:flex;gap:6px;margin-top:14px;justify-content:center;flex-wrap:wrap">

    </div>`;
  }
  h+=`</div>`; // /pj-layout
  
  c.innerHTML=h;

// Parse weight log entries into structured data
function parseWeightLog(logEntry){
  // Returns array of {name, weight, reps}
  // Handles 2 formats:
  //   1. Old format: string like "Squat 80kg×5, Bench 65kg×6"
  //   2. New format: object {exKey: {w, r, n}, ...}
  if(!logEntry)return[];
  const out=[];
  // New format: object
  if(typeof logEntry==='object'&&!Array.isArray(logEntry)){
    Object.values(logEntry).forEach(v=>{
      if(v&&v.n&&typeof v.w==='number'&&!isNaN(v.w)){
        out.push({name:v.n,weight:v.w,reps:typeof v.r==='number'?v.r:0});
      }
    });
    return out;
  }
  // Old format: string
  if(typeof logEntry==='string'){
    logEntry.split(/[,\n]+/).forEach(part=>{
      part=part.trim();if(!part)return;
      const m=part.match(/^(.+?)\s*(\d+(?:\.\d+)?)\s*kg\s*[x×]\s*(\d+)/i);
      if(m){
        out.push({name:m[1].trim(),weight:parseFloat(m[2]),reps:parseInt(m[3])});
      }
    });
  }
  return out;
}

function renderLiftChart(){
  const box=document.getElementById('liftBox');
  if(!box)return;
  // Look back 8 weeks for trend
  const lookbackDays=56;
  const now=new Date();
  const allEntries=[]; // {date, name, weight, reps}
  for(let i=lookbackDays;i>=0;i--){
    const d=new Date(now);d.setDate(now.getDate()-i);
    const ds_=ds(d);
    const log=weightLog[ds_];
    if(!log)continue;
    const parsed=parseWeightLog(log);
    parsed.forEach(p=>allEntries.push({date:ds_,...p}));
  }
  
  if(!allEntries.length){
    box.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--mt)">
      <div style="font-size:36px;margin-bottom:8px">🏋️</div>
      <div style="font-size:14px;font-weight:600">Chưa có log mức tạ</div>
      <div style="font-size:12px;margin-top:6px">Vào tab Workout, nhập "Mức tạ hôm nay" để bắt đầu tracking</div>
      <div style="font-size:11px;color:var(--mt);margin-top:8px;font-style:italic">VD: "Squat 80kg×5, Bench 65kg×6"</div>
    </div>`;
    return;
  }
  
  // Group by exercise name (case-insensitive, strip variations)
  const byExercise={};
  allEntries.forEach(e=>{
    const key=e.name.toLowerCase().trim();
    if(!byExercise[key])byExercise[key]={name:e.name,points:[]};
    // For each date, keep MAX weight as the working set proxy
    const existing=byExercise[key].points.find(p=>p.date===e.date);
    if(!existing||existing.weight<e.weight){
      if(existing){existing.weight=e.weight;existing.reps=e.reps}
      else byExercise[key].points.push({date:e.date,weight:e.weight,reps:e.reps});
    }
  });
  
  // Sort points by date
  Object.values(byExercise).forEach(ex=>ex.points.sort((a,b)=>a.date.localeCompare(b.date)));
  
  // Take top 6 exercises by frequency
  const topExercises=Object.values(byExercise).sort((a,b)=>b.points.length-a.points.length).slice(0,6);
  
  // Build label set (all unique dates sorted)
  const allDates=[...new Set(allEntries.map(e=>e.date))].sort();
  const colors=['#0071e3','#34c759','#ff9500','#af52de','#ff2d55','#30b0c7'];
  
  const datasets=topExercises.map((ex,i)=>({
    label:ex.name,
    data:allDates.map(d=>{const p=ex.points.find(x=>x.date===d);return p?p.weight:null}),
    borderColor:colors[i%colors.length],
    backgroundColor:colors[i%colors.length]+'20',
    borderWidth:2.5,
    tension:.3,
    pointRadius:4,
    pointHoverRadius:6,
    spanGaps:true
  }));
  
  // Format date labels — show as "DD/MM"
  const dateLabels=allDates.map(d=>{const parts=d.split('-');return parts[2]+'/'+parts[1]});
  
  box.innerHTML=`<canvas id="liftCanvas" style="max-height:300px"></canvas>`;
  const cv=document.getElementById('liftCanvas');
  if(!cv||typeof Chart==='undefined')return;
  new Chart(cv,{type:'line',
    data:{labels:dateLabels,datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'bottom',labels:{font:{size:11},boxWidth:14,padding:10,usePointStyle:true}},tooltip:{callbacks:{label:ctx=>{
      const ex=topExercises[ctx.datasetIndex];
      const p=ex.points.find(x=>{const parts=x.date.split('-');return parts[2]+'/'+parts[1]===ctx.label});
      return `${ctx.dataset.label}: ${ctx.parsed.y}kg${p?` × ${p.reps}`:''}`;
    }}}},scales:{y:{beginAtZero:false,ticks:{color:'#86868b',font:{size:11},callback:v=>v+'kg'},grid:{color:'rgba(0,0,0,.04)'}},x:{ticks:{color:'#86868b',font:{size:10},maxRotation:0,autoSkip:true,maxTicksLimit:10},grid:{display:false}}}}
  });
}

function hexToHSL(hex){let r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b),min=Math.min(r,g,b);let h,s,l=(max+min)/2;
  if(max===min){h=s=0}else{const d=max-min;s=l>.5?d/(2-max-min):d/(max+min);
    switch(max){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break}}
  return{h:h*360,s:s*100,l:l*100}}
function lighten(hex,amt){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return'#'+[r,g,b].map(c=>Math.min(255,Math.round(c+(255-c)*amt)).toString(16).padStart(2,'0')).join('')}
function darken(hex,amt){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return'#'+[r,g,b].map(c=>Math.max(0,Math.round(c*(1-amt))).toString(16).padStart(2,'0')).join('')}

// ===== CHAT (Claude API) =====
// ===== RADAR CHART (Weekly) =====
function drawRadar(canvasId,labels,values){
  const cv=document.getElementById(canvasId);if(!cv)return;const ctx=cv.getContext('2d');
  const w=cv.width=250,h=cv.height=250,cx=w/2,cy=h/2,r=90,n=labels.length;
  ctx.clearRect(0,0,w,h);
  // Grid
  for(let lv=0.25;lv<=1;lv+=0.25){ctx.beginPath();for(let i=0;i<=n;i++){const a=-Math.PI/2+(2*Math.PI/n)*(i%n);ctx.lineTo(cx+r*lv*Math.cos(a),cy+r*lv*Math.sin(a))}ctx.strokeStyle='rgba(0,0,0,.05)';ctx.stroke()}
  // Labels
  ctx.font='11px -apple-system,sans-serif';ctx.fillStyle='#86868b';ctx.textAlign='center';
  for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;const lx=cx+(r+18)*Math.cos(a),ly=cy+(r+18)*Math.sin(a);ctx.fillText(labels[i],lx,ly+3)}
  // Data
  ctx.beginPath();for(let i=0;i<=n;i++){const a=-Math.PI/2+(2*Math.PI/n)*(i%n);const v=values[i%n]/100;ctx.lineTo(cx+r*v*Math.cos(a),cy+r*v*Math.sin(a))}
  ctx.fillStyle='rgba(0,113,227,.12)';ctx.fill();ctx.strokeStyle='#0071e3';ctx.lineWidth=2;ctx.stroke();
  // Dots
  for(let i=0;i<n;i++){const a=-Math.PI/2+(2*Math.PI/n)*i;const v=values[i]/100;ctx.beginPath();ctx.arc(cx+r*v*Math.cos(a),cy+r*v*Math.sin(a),3,0,2*Math.PI);ctx.fillStyle='#0071e3';ctx.fill()}}
